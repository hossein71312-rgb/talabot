name: gold
on:
  workflow_dispatch:
    inputs:
      test:
        description: send test message
        type: boolean
        default: false
concurrency:
  group: gold
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: state
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-
      - run: python rubika_runner.py
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          SEND_TEST: ${{ inputs.test }}
